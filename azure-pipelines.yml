# Build, test and pack the .NET solution.
# The integration tests need table storage; they run only when a secret
# pipeline variable named StorageConnectionString is defined.
# https://learn.microsoft.com/azure/devops/pipelines/ecosystems/dotnet-core

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: 'AzureStorage.slnx'
  buildConfiguration: 'Release'

steps:
- task: UseDotNet@2
  inputs:
    useGlobalJson: true

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: '$(solution)'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: '$(solution)'
    arguments: '--configuration $(buildConfiguration) --no-restore -p:ContinuousIntegrationBuild=true'

- script: dotnet test --solution $(solution) -c $(buildConfiguration) --no-build
  displayName: 'Test'
  condition: and(succeeded(), ne(variables['StorageConnectionString'], ''))
  env:
    StorageConnectionString: $(StorageConnectionString)

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    packagesToPack: 'src/*.csproj'
    nobuild: true
    configuration: '$(buildConfiguration)'
    versioningScheme: 'off'
    verbosityPack: 'Normal'

- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: 'drop'
    publishLocation: 'Container'
